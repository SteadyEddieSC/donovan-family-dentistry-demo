media:
  - name: images
    label: Website images
    input: public/images
    output: /images
    extensions: [png, jpg, jpeg, webp, svg]
    rename: safe
  - name: forms
    label: Patient PDF forms
    input: public/forms
    output: /forms
    extensions: [pdf]
    rename: safe

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "office update: add {filename}"
      update: "office update: revise {filename}"
      delete: "office update: remove {filename}"


actions:
  - name: verify-website
    label: Build and verify website
    workflow: office-site-check.yml
    ref: current
    cancelable: false

content:
  - name: quick-updates
    label: Quick updates
    type: group
    items:
      - name: site
        label: Contact, hours, homepage, and announcement
        type: file
        path: src/data/site.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - { name: practiceName, label: Practice name, type: string, required: true }
          - { name: tagline, label: Homepage headline, type: string, required: true, options: { maxlength: 110 } }
          - { name: introduction, label: Homepage introduction, type: text, required: true, options: { maxlength: 350 } }
          - { name: phoneDisplay, label: Display phone number, type: string, required: true }
          - { name: phoneHref, label: Click-to-call number, type: string, required: true, description: "Use +1 followed by the ten-digit number." }
          - { name: contactEmail, label: Office email address, type: string, required: true, description: "Public office contact email used on the Contact page and contact card." }
          - name: address
            label: Address
            type: object
            required: true
            fields:
              - { name: street, label: Street, type: string, required: true }
              - { name: city, label: City, type: string, required: true }
              - { name: state, label: State, type: string, required: true }
              - { name: postalCode, label: ZIP code, type: string, required: true }
          - name: hours
            label: Office hours
            type: object
            list:
              min: 7
              max: 7
              collapsible:
                collapsed: true
                summary: "{day}: {hours}"
            fields:
              - { name: day, label: Day, type: string, required: true, readonly: true }
              - { name: hours, label: Hours, type: string, required: true }
          - { name: heroImage, label: Office image, type: image, required: true, options: { media: images } }
          - { name: heroAlt, label: Office image description, type: text, required: true, description: "Describe the image for visitors who cannot see it." }
          - { name: socialImage, label: Social sharing image, type: image, required: true, options: { media: images } }
          - { name: logo, label: Practice logo, type: image, required: true, options: { media: images } }
          - { name: logoAlt, label: Logo description, type: string, required: true }
          - name: serviceArea
            label: Communities served
            type: string
            list: true
          - name: announcement
            label: Homepage announcement
            type: object
            fields:
              - { name: enabled, label: Show announcement, type: boolean }
              - { name: text, label: Announcement text, type: text, options: { maxlength: 300 }, description: "Required when the announcement is turned on." }
          - name: seo
            label: Search preview
            type: object
            fields:
              - { name: title, label: Homepage page title, type: string, required: true, options: { maxlength: 65 } }
              - { name: description, label: Homepage description, type: text, required: true, options: { maxlength: 165 } }

  - name: page-wording
    label: Modern page wording
    type: group
    items:
      - name: practice-content
        label: About, Team, and Services page wording
        type: file
        path: src/data/practice-content.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: about
            label: About page
            type: object
            fields:
              - { name: kicker, label: Small heading, type: string, required: true }
              - { name: headline, label: Main heading, type: text, required: true }
              - { name: introduction, label: Introduction, type: text, required: true }
              - { name: storyEyebrow, label: Story small heading, type: string, required: true }
              - { name: storyTitle, label: Story heading, type: text, required: true }
              - { name: storyParagraphs, label: Story paragraphs, type: text, list: true, required: true }
              - { name: locationEyebrow, label: Location small heading, type: string, required: true }
              - { name: locationTitle, label: Location heading, type: string, required: true }
              - { name: locationText, label: Location text, type: text, required: true }
              - { name: valuesEyebrow, label: Values small heading, type: string, required: true }
              - { name: valuesTitle, label: Values heading, type: text, required: true }
              - name: values
                label: Values
                type: object
                list: true
                fields:
                  - { name: number, label: Number, type: string, required: true }
                  - { name: title, label: Title, type: string, required: true }
                  - { name: text, label: Text, type: text, required: true }
              - { name: journeyEyebrow, label: Patient journey small heading, type: string, required: true }
              - { name: journeyTitle, label: Patient journey heading, type: text, required: true }
              - name: journey
                label: Patient journey cards
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string, required: true }
                  - { name: text, label: Text, type: text, required: true }
          - name: teamPage
            label: Team page headings
            type: object
            fields:
              - { name: kicker, label: Small heading, type: string, required: true }
              - { name: headline, label: Main heading, type: text, required: true }
              - { name: introduction, label: Introduction, type: text, required: true }
              - { name: providersEyebrow, label: Dentist section small heading, type: string, required: true }
              - { name: providersTitle, label: Dentist section heading, type: text, required: true }
              - { name: providersIntroduction, label: Dentist section introduction, type: text, required: true }
              - { name: teamEyebrow, label: Staff section small heading, type: string, required: true }
              - { name: teamTitle, label: Staff section heading, type: string, required: true }
              - { name: teamIntroduction, label: Staff section introduction, type: text, required: true }
          - name: servicesPage
            label: Services page headings and groups
            type: object
            fields:
              - { name: kicker, label: Small heading, type: string, required: true }
              - { name: headline, label: Main heading, type: text, required: true }
              - { name: introduction, label: Introduction, type: text, required: true }
              - name: groups
                label: Service groups
                type: object
                list: true
                fields:
                  - { name: id, label: Internal group ID, type: string, required: true, description: "Do not change unless the matching services are also updated." }
                  - { name: title, label: Group title, type: string, required: true }
                  - { name: summary, label: Group summary, type: text, required: true }
                  - { name: planning, label: Planning note, type: text, required: true }
                  - { name: order, label: Display order, type: number, required: true }
              - { name: planningEyebrow, label: Planning small heading, type: string, required: true }
              - { name: planningTitle, label: Planning heading, type: string, required: true }
              - { name: planningText, label: Planning text, type: text, required: true }

  - name: people
    label: Dentists and team
    type: group
    items:
      - name: providers
        label: Dentist profiles
        type: file
        path: src/data/providers.json
        format: json
        list: true
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - { name: id, label: Internal ID, type: string, required: true, readonly: true }
          - { name: name, label: Public name, type: string, required: true }
          - { name: credentials, label: Credentials, type: string }
          - { name: role, label: Role, type: string, required: true }
          - { name: visible, label: Show profile, type: boolean }
          - { name: order, label: Display order, type: number, required: true }
          - { name: status, label: Approval status, type: string, required: true, description: "Use verified or approved before showing a real profile. Sample profiles cannot be visible." }
          - { name: imageType, label: Image type, type: string, required: true, description: "Use photo or illustration." }
          - { name: photo, label: Photograph, type: image, options: { media: images } }
          - { name: photoAlt, label: Photograph description, type: text }
          - { name: portrait, label: Illustration style, type: string }
          - { name: summary, label: Short summary, type: text, required: true }
          - { name: biography, label: Classic-site biography paragraphs, type: text, list: true, required: true }
          - { name: details, label: Modern-site biography paragraphs, type: text, list: true, required: true }
          - { name: highlights, label: Profile highlights, type: string, list: true, required: true }
      - name: team
        label: Front office, hygiene, and assisting profiles
        type: file
        path: src/data/modern-team.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: team
            label: Team profiles
            type: object
            list: true
            fields:
              - { name: id, label: Internal ID, type: string, required: true }
              - { name: name, label: Public name or team name, type: string, required: true }
              - { name: role, label: Role, type: string, required: true }
              - { name: portrait, label: Illustration style, type: string, required: true }
              - { name: visible, label: Show profile, type: boolean }
              - { name: status, label: Approval status, type: string, required: true }
              - { name: bio, label: Public description, type: text, required: true }

  - name: patient-information
    label: Services and patient forms
    type: group
    items:
      - name: services
        label: Published services
        type: file
        path: src/data/services.json
        format: json
        list: true
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - { name: name, label: Service name, type: string, required: true, options: { maxlength: 100 } }
          - { name: visible, label: Show service, type: boolean }
          - { name: order, label: Display order, type: number, required: true }
          - { name: groupId, label: Service group ID, type: string, required: true, description: "Use restore, smile, or advanced unless the service groups are changed." }
      - name: forms
        label: Downloadable patient forms
        type: file
        path: src/data/forms.json
        format: json
        list: true
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - { name: title, label: Form title, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: file, label: PDF file, type: file, required: true, options: { media: forms, extensions: [pdf] } }
          - { name: visible, label: Show form, type: boolean }
          - { name: order, label: Display order, type: number, required: true }
          - { name: fillable, label: Fillable on a device, type: boolean, readonly: true }
