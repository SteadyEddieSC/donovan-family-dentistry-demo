name: Production candidate monitor

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Optional Pages URL to check
        required: false
        default: https://donovan-family-dentistry-demo.pages.dev
        type: string
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

concurrency:
  group: production-candidate-monitor
  cancel-in-progress: true

jobs:
  health-and-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: ${{ inputs.site_url || 'https://donovan-family-dentistry-demo.pages.dev' }}
    steps:
      - name: Check out the current production candidate without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce production-aware dependency policy
        run: npm run check:audit

      - name: Run serverless and launch-boundary safety tests
        run: npm run test:unit

      - name: Build and enforce launch and performance budgets
        run: npm run build

      - name: Validate generated SEO, structured data, internal links, and HTML
        run: |
          npm run check:seo
          npm run check:structured-data
          npm run check:links
          npm run check:html

      - name: Check deployed pages, links, forms, robots, and preview controls
        run: npm run check:deployed

      - name: Write monitoring result
        if: success()
        run: |
          {
            echo '## Production candidate healthy'
            echo ''
            echo "Checked: ${SITE_URL}"
            echo ''
            echo 'Locked-dependency, unit, launch-boundary, build, performance-budget, deterministic SEO, structured-data, generated-HTML, sitemap, internal-link, PDF, social-image, robots, noindex, and preview-form checks passed.'
            echo ''
            echo 'This monitor does not submit the administrative form and does not collect or store visitor message content.'
          } >> "$GITHUB_STEP_SUMMARY"
