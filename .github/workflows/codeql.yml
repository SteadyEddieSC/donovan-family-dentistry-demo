name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6a90bf1f5426d0c367cad0b2000f3b721bab3122 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6a90bf1f5426d0c367cad0b2000f3b721bab3122 # v4
        with:
          category: /language:javascript-typescript
