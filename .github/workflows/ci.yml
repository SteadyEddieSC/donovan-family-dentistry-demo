name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and create the initial lockfile
        run: npm install --no-audit --no-fund
      - name: Save generated lockfile for Release 14 review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 7
          if-no-files-found: error
      - name: Review dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run serverless inquiry unit tests
        run: npm run test:unit
      - name: Build static site and enforce performance budgets
        run: npm run build
      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install branded Chrome and Edge
        run: npx playwright install chrome msedge
      - name: Run primary browser and accessibility tests
        run: npm run test:e2e
      - name: Run production-candidate compatibility matrix
        run: npm run test:compat
      - name: Upload browser-test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            playwright-report-compatibility/
            test-results/
            test-results-compatibility/
          retention-days: 14
          if-no-files-found: warn
