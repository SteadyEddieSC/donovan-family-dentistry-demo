name: Office website check

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context
        required: false
        default: '{}'
        type: string

permissions:
  contents: read

jobs:
  verify-website:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out selected website version without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked website dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce dependency vulnerability policy
        run: npm run check:audit

      - name: Check the protected administrative request handler and launch boundaries
        run: npm run test:unit

      - name: Validate office-managed content, images, launch controls, and performance budgets
        run: npm run build

      - name: Validate SEO, structured data, internal links, and generated HTML
        run: |
          npm run check:seo
          npm run check:structured-data
          npm run check:links
          npm run check:html

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install branded Chrome and Edge
        run: npx playwright install chrome msedge

      - name: Run Lighthouse CI
        run: npm run check:lighthouse

      - name: Run layout, link, form, mobile, metadata, screenshot, and accessibility checks
        run: npm run test:e2e

      - name: Run the production-candidate browser compatibility matrix
        run: npm run test:compat

      - name: Save a copy of the successfully built website and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: office-website-build
          path: |
            dist/
            validation-reports/
            .lighthouseci/
            playwright-report/
            playwright-report-compatibility/
            test-results/
            test-results-compatibility/
          retention-days: 7
          if-no-files-found: warn

      - name: Write a plain-language result
        run: |
          {
            echo '## Website check passed'
            echo ''
            echo 'The already-saved branch is valid; locked-dependency, administrative-request, launch-safety, responsive-image, performance-budget, SEO, structured-data, HTML, Lighthouse, browser, link, form, mobile, screenshot, compatibility, and automated accessibility checks passed.'
            echo ''
            echo 'This manual check does not save content and does not start a separate deployment. Saving to main creates the GitHub commit that triggers the normal Cloudflare Pages deployment; compare the workflow commit with the Cloudflare deployment commit.'
            echo ''
            echo 'Automation does not replace physical-device, keyboard, screen-reader, Search Console, Rich Results, production-domain, and office-approval checks.'
          } >> "$GITHUB_STEP_SUMMARY"
