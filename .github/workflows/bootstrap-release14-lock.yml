name: Bootstrap Release 14 lockfile

on:
  push:
    branches: [release/14-production-candidate]

permissions:
  contents: write

concurrency:
  group: bootstrap-release14-lock
  cancel-in-progress: true

jobs:
  commit-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/14-production-candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the lockfile when it changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Release 14: commit deterministic npm lockfile [lockfile-bootstrap]'
          git push origin HEAD:release/14-production-candidate
