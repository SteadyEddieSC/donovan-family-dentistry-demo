name: Security baseline

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '53 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    uses: LowcountryDigitalWorks/.github/.github/workflows/security-dependencies-npm.yml@56fb3da846983e05f282d726840264e3dca62d90
    with:
      online_queries: false
      verify_canary: false

  secret-scan:
    if: ${{ github.event_name != 'schedule' }}
    uses: LowcountryDigitalWorks/.github/.github/workflows/security-secrets.yml@56fb3da846983e05f282d726840264e3dca62d90
    with:
      verify_canary: false
